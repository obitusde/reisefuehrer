# Länderpaket aufbereiten (v0.12.0): alles, was die Karte an Sehenswürdigkeiten zeigt (Verzeichnis aus Wikidata/Wikipedia,
# OSM-Punkte aus dem Geofabrik-Auszug), als eine Datei docs/paket/<code>/paket.json. Die App lädt es mit einem Tipp herunter.
# Nur von Hand: github.com → Actions → „Länderpaket aufbereiten“ → „Run workflow“ (Schweiz etwa 15–25 Minuten).
name: Länderpaket aufbereiten
on:
  workflow_dispatch:
    inputs:
      land:
        description: 'Geofabrik-Gebiet'
        required: false
        default: 'europe/switzerland'
      code:
        description: 'Kürzel (Ordner docs/paket/<code>)'
        required: false
        default: 'ch'
      name:
        description: 'Name in der App'
        required: false
        default: 'Schweiz'
      speichern:
        description: 'Ergebnis nach main schreiben (sonst nur messen)'
        type: boolean
        default: true
      max:
        description: 'Nur Test: höchstens so viele Verzeichnis-Kacheln (leer = alle)'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: paket
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      LAND: ${{ inputs.land }}
      CODE: ${{ inputs.code }}
      NAME: ${{ inputs.name }}
      MAX: ${{ inputs.max }}
      SPEICHERN: ${{ inputs.speichern }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Eingaben prüfen
        run: |
          if ! [[ "$LAND" =~ ^[a-z-]+(/[a-z-]+)*$ ]]; then echo "Ungültiges Gebiet"; exit 1; fi
          if ! [[ "$CODE" =~ ^[a-z]{2,3}$ ]]; then echo "Ungültiges Kürzel"; exit 1; fi
          if ! [[ "$NAME" =~ ^[[:alpha:]\ .-]{2,40}$ ]]; then echo "Ungültiger Name"; exit 1; fi
          if [ -n "$MAX" ] && ! [[ "$MAX" =~ ^[0-9]+$ ]]; then echo "Ungültiges max"; exit 1; fi
      - name: osmium installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool > /dev/null && osmium --version | head -1
      - name: Auszug laden
        run: |
          s=$(date +%s)
          curl -sSfL -o land.osm.pbf "https://download.geofabrik.de/${LAND}-latest.osm.pbf"
          curl -sSfL -o land.poly "https://download.geofabrik.de/${LAND}.poly"
          STAND=$(osmium fileinfo -g header.option.osmosis_replication_timestamp land.osm.pbf || true)
          echo "STAND=$STAND" >> "$GITHUB_ENV"
          osmium tags-filter land.osm.pbf r/admin_level=2 -o grenze.osm.pbf --overwrite
          osmium export grenze.osm.pbf -f geojson --geometry-types=polygon -o grenze.geojson --overwrite || echo "Grenze: Export mit Fehlern"
          echo "Datei: $(du -h land.osm.pbf | cut -f1), Stand OSM: ${STAND:-?}, $(( $(date +%s) - s )) s"
      - name: OSM-Punkte
        run: |
          s=$(date +%s)
          FILTER=$(node tools/osm-extract.mjs --osmium)
          osmium tags-filter land.osm.pbf $FILTER -o poi.osm.pbf --overwrite
          osmium export poi.osm.pbf -f geojsonseq --add-unique-id=type_id -o poi.geojsonseq --overwrite
          rm -rf "docs/osm/$CODE"
          U=$(echo "$CODE" | tr a-z A-Z)
          node tools/osm-extract.mjs poi.geojsonseq "docs/osm/$CODE" --grenze=grenze.geojson --poly=land.poly --stand="$STAND" --land="$U" \
            --quelle="OpenStreetMap-Mitwirkende (ODbL), Auszug Geofabrik $LAND" | grep -v '^Beispiele'
          echo "OSM: $(( $(date +%s) - s )) s"
      - name: Verzeichnis und Paket
        run: |
          U=$(echo "$CODE" | tr a-z A-Z)
          node tools/paket.mjs --land="$U" --name="$NAME" --grenze=grenze.geojson --osm="docs/osm/$CODE" --out="docs/paket/$CODE" ${MAX:+--max=$MAX}
          ls -la "docs/paket/$CODE"
      - name: Speichern
        if: ${{ env.SPEICHERN == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "docs/paket/$CODE" "docs/osm/$CODE"
          if git diff --cached --quiet; then echo "Keine Änderung"; exit 0; fi
          git commit -q -m "Länderpaket $CODE aufbereitet (OSM-Stand ${STAND:-?})"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
