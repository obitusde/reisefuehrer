# Stadt-Sterne neu berechnen (PROJEKT.md 6c). Vom Handy: github.com → Actions → „Stadt-Sterne berechnen“ → „Run workflow“.
# Fragt Wikidata je Kartenkachel ab und schreibt docs/staedte/*.json nach main (dauert für alle Länder etwa 30–90 Minuten).
name: Stadt-Sterne berechnen
on:
  workflow_dispatch:
    inputs:
      laender:
        description: 'Länder (z. B. "DE CH"), leer = alle'
        required: false
        default: ''
      frisch:
        description: 'Wikidata neu abfragen (sonst gespeicherte Kacheln bis 25 Tage nehmen und nur neu rechnen)'
        type: boolean
        default: false
      namen:
        description: 'Nur Test: Namen im Protokoll erklären, z. B. "Manchester|Windsor"'
        required: false
        default: ''
      min_sl:
        description: 'Nur Test: andere Mindestzahl Sprachversionen (leer = config.json)'
        required: false
        default: ''
      strecke:
        description: 'Nur Test v0.9: Strecke "lat,lon;lat,lon auto|fahrrad|fuss"'
        required: false
        default: ''
      verzeichnis:
        description: 'Nur Test v0.8: Verzeichnis für Kacheln "süd,west,nord,ost;…" (Fokus danach mit Leerzeichen)'
        required: false
        default: ''
      probe:
        description: 'Nur Test: Kacheln "süd,west,nord,ost;…" ansehen (erste ausführlich), nichts speichern'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: staedte
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Zwischenspeicher holen
        uses: actions/cache/restore@v4
        with:
          path: tools/.cache
          key: staedte-${{ github.run_id }}
          restore-keys: staedte-
      - name: Strecken-Test
        if: ${{ inputs.strecke != '' }}
        env:
          ST: ${{ inputs.strecke }}
        run: |
          if ! [[ "$ST" =~ ^[-0-9.,\;]+\ (auto|fahrrad|fuss)$ ]]; then echo "Ungültig"; exit 1; fi
          read -r PTS MODE <<< "$ST"
          node tools/build-cities.mjs --strecke "$PTS" "$MODE"
      - name: Verzeichnis-Test
        if: ${{ inputs.verzeichnis != '' }}
        env:
          VZ: ${{ inputs.verzeichnis }}
          NAMEN: ${{ inputs.namen }}
        run: |
          if ! [[ "$VZ" =~ ^[-0-9.,\;\ ]+$ ]]; then echo "Ungültig"; exit 1; fi
          read -r KACHELN FOKUS <<< "$VZ"
          node tools/build-cities.mjs --verzeichnis "$KACHELN" --fokus "$FOKUS"
      - name: Probe
        if: ${{ inputs.probe != '' }}
        env:
          PROBE: ${{ inputs.probe }}
          MIN_SL: ${{ inputs.min_sl }}
        run: |
          if ! [[ "$PROBE" =~ ^[-0-9.,\;]+$ ]]; then echo "Ungültig"; exit 1; fi
          node tools/build-cities.mjs --probe "$PROBE"
      - name: Berechnen
        if: ${{ inputs.probe == '' && inputs.verzeichnis == '' && inputs.strecke == '' }}
        env:
          LAENDER: ${{ inputs.laender }}
          FRISCH: ${{ inputs.frisch }}
          NAMEN: ${{ inputs.namen }}
        run: node tools/build-cities.mjs
      - name: Zwischenspeicher sichern
        if: ${{ inputs.probe == '' && inputs.verzeichnis == '' && inputs.strecke == '' }}
        uses: actions/cache/save@v4
        with:
          path: tools/.cache
          key: staedte-${{ github.run_id }}
      - name: Speichern
        if: ${{ inputs.probe == '' && inputs.verzeichnis == '' && inputs.strecke == '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/staedte
          if git diff --cached --quiet; then echo "Keine Änderung"; exit 0; fi
          git commit -m "Stadt-Sterne neu berechnet"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
