# Stadt-Sterne neu berechnen (PROJEKT.md 6c). Vom Handy: github.com → Actions → „Stadt-Sterne berechnen“ → „Run workflow“.
# Fragt Wikidata je Kartenkachel ab und schreibt docs/staedte/*.json nach main (dauert für alle Länder etwa 30–90 Minuten).
name: Stadt-Sterne berechnen
on:
  workflow_dispatch:
    inputs:
      laender:
        description: 'Länder (z. B. "DE CH"), leer = alle'
        required: false
        default: ''
      probe:
        description: 'Nur Test: Kacheln "süd,west,nord,ost;…" ansehen (erste ausführlich), nichts speichern'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: staedte
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Probe
        if: ${{ inputs.probe != '' }}
        env:
          PROBE: ${{ inputs.probe }}
        run: |
          if ! [[ "$PROBE" =~ ^[-0-9.,\;]+$ ]]; then echo "Ungültig"; exit 1; fi
          node tools/build-cities.mjs --probe "$PROBE"
      - name: Berechnen
        if: ${{ inputs.probe == '' }}
        env:
          LAENDER: ${{ inputs.laender }}
        run: node tools/build-cities.mjs
      - name: Speichern
        if: ${{ inputs.probe == '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/staedte
          if git diff --cached --quiet; then echo "Keine Änderung"; exit 0; fi
          git commit -m "Stadt-Sterne neu berechnet"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
