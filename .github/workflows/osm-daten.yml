# Test: OpenStreetMap-Sehenswürdigkeiten aus einem Geofabrik-Auszug statt über Overpass (die Server sind oft überlastet).
# Misst Zeit, Anzahl und Größe; schreibt noch nichts nach docs/. Die Kacheln liegen 3 Tage als Artefakt bereit.
name: OSM-Daten aufbereiten (Test)
on:
  workflow_dispatch:
    inputs:
      land:
        description: 'Geofabrik-Gebiet, z. B. "europe/switzerland"'
        required: false
        default: 'europe/switzerland'
      teil:
        description: 'Teilgebiet extra zählen: "west,süd,ost,nord" (leer = keins; Waadt: 6.06,46.18,7.25,46.99)'
        required: false
        default: '6.06,46.18,7.25,46.99'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Eingaben prüfen
        env:
          LAND: ${{ inputs.land }}
          TEIL: ${{ inputs.teil }}
        run: |
          if ! [[ "$LAND" =~ ^[a-z-]+(/[a-z-]+)*$ ]]; then echo "Ungültiges Gebiet"; exit 1; fi
          if [ -n "$TEIL" ] && ! [[ "$TEIL" =~ ^-?[0-9.]+,-?[0-9.]+,-?[0-9.]+,-?[0-9.]+$ ]]; then echo "Ungültiges Teilgebiet"; exit 1; fi
      - name: osmium installieren
        run: |
          s=$(date +%s)
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool > /dev/null
          osmium --version | head -1
          echo "Installieren: $(( $(date +%s) - s )) s"
      - name: Auszug laden
        env:
          LAND: ${{ inputs.land }}
        run: |
          s=$(date +%s)
          curl -sSfL -o land.osm.pbf "https://download.geofabrik.de/${LAND}-latest.osm.pbf"
          echo "Datei: $(du -h land.osm.pbf | cut -f1), Laden: $(( $(date +%s) - s )) s"
      - name: Sehenswürdigkeiten filtern
        run: |
          s=$(date +%s)
          FILTER=$(node tools/osm-extract.mjs --osmium)
          echo "Filter: $FILTER"
          osmium tags-filter land.osm.pbf $FILTER -o poi.osm.pbf --overwrite
          echo "Gefiltert: $(du -h poi.osm.pbf | cut -f1), $(( $(date +%s) - s )) s"
          s=$(date +%s)
          osmium export poi.osm.pbf -f geojsonseq --add-unique-id=type_id -o poi.geojsonseq --overwrite
          echo "Export: $(du -h poi.geojsonseq | cut -f1), $(( $(date +%s) - s )) s"
      - name: Kacheln bauen und messen
        env:
          TEIL: ${{ inputs.teil }}
        run: node tools/osm-extract.mjs poi.geojsonseq out "$TEIL"
      - name: Kacheln als Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: osm-kacheln
          path: out
          retention-days: 3
