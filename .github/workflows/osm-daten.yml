# OpenStreetMap-Sehenswürdigkeiten aus dem Geofabrik-Auszug aufbereiten (v0.11.0), statt sie im Handy über Overpass zu fragen
# (die Server sind oft überlastet). Schreibt docs/osm/<code>/ (Kacheln + index.json mit dem Stand der Daten) nach main.
# Nur von Hand (Wunsch Nutzer, v0.11.1: kein automatisches Update): github.com → Actions → „OSM-Daten aufbereiten“ → „Run workflow“
# (dauert etwa 2–3 Minuten). Danach in der App: Menü → Daten → „Jetzt prüfen“.
name: OSM-Daten aufbereiten
on:
  workflow_dispatch:
    inputs:
      land:
        description: 'Geofabrik-Gebiet'
        required: false
        default: 'europe/switzerland'
      code:
        description: 'Kürzel (Ordner docs/osm/<code>)'
        required: false
        default: 'ch'
      speichern:
        description: 'Ergebnis nach main schreiben (sonst nur messen)'
        type: boolean
        default: true
      teil:
        description: 'Nur Bericht: Teilgebiet extra zählen "west,süd,ost,nord" (Waadt: 6.06,46.18,7.25,46.99)'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: osm-daten
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LAND: ${{ inputs.land || 'europe/switzerland' }}
      CODE: ${{ inputs.code || 'ch' }}
      TEIL: ${{ inputs.teil }}
      SPEICHERN: ${{ inputs.speichern }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Eingaben prüfen
        run: |
          if ! [[ "$LAND" =~ ^[a-z-]+(/[a-z-]+)*$ ]]; then echo "Ungültiges Gebiet"; exit 1; fi
          if ! [[ "$CODE" =~ ^[a-z]{2,3}$ ]]; then echo "Ungültiges Kürzel"; exit 1; fi
          if [ -n "$TEIL" ] && ! [[ "$TEIL" =~ ^-?[0-9.]+,-?[0-9.]+,-?[0-9.]+,-?[0-9.]+$ ]]; then echo "Ungültiges Teilgebiet"; exit 1; fi
      - name: osmium installieren
        run: |
          s=$(date +%s)
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool > /dev/null
          osmium --version | head -1
          echo "Installieren: $(( $(date +%s) - s )) s"
      - name: Auszug und Grenze laden
        run: |
          s=$(date +%s)
          curl -sSfL -o land.osm.pbf "https://download.geofabrik.de/${LAND}-latest.osm.pbf"
          curl -sSfL -o land.poly "https://download.geofabrik.de/${LAND}.poly"
          STAND=$(osmium fileinfo -g header.option.osmosis_replication_timestamp land.osm.pbf || true)
          # the real national border (admin_level=2) from the data itself; the .poly is only the fallback
          osmium tags-filter land.osm.pbf r/admin_level=2 -o grenze.osm.pbf --overwrite
          osmium export grenze.osm.pbf -f geojson --geometry-types=polygon -o grenze.geojson --overwrite || echo "Grenze: Export mit Fehlern"
          echo "STAND=$STAND" >> "$GITHUB_ENV"
          echo "Datei: $(du -h land.osm.pbf | cut -f1), Stand der Daten: ${STAND:-?}, Laden: $(( $(date +%s) - s )) s"
      - name: Sehenswürdigkeiten filtern
        run: |
          s=$(date +%s)
          FILTER=$(node tools/osm-extract.mjs --osmium)
          osmium tags-filter land.osm.pbf $FILTER -o poi.osm.pbf --overwrite
          osmium export poi.osm.pbf -f geojsonseq --add-unique-id=type_id -o poi.geojsonseq --overwrite
          echo "Gefiltert und exportiert: $(du -h poi.geojsonseq | cut -f1), $(( $(date +%s) - s )) s"
      - name: Kacheln bauen
        run: |
          rm -rf "docs/osm/$CODE"
          U=$(echo "$CODE" | tr a-z A-Z)
          node tools/osm-extract.mjs poi.geojsonseq "docs/osm/$CODE" --grenze=grenze.geojson --poly=land.poly --stand="$STAND" --land="$U" --teil="$TEIL" \
            --karte="5.95,46.10,6.35,46.40;7.40,47.45,7.80,47.70" \
            --quelle="OpenStreetMap-Mitwirkende (ODbL), Auszug Geofabrik $LAND"
          echo "Dateien: $(ls "docs/osm/$CODE" | wc -l), $(du -sh "docs/osm/$CODE" | cut -f1)"
      - name: Speichern
        if: ${{ env.SPEICHERN == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "docs/osm/$CODE"
          if git diff --cached --quiet; then echo "Keine Änderung"; exit 0; fi
          git commit -q -m "OSM-Daten $CODE aufbereitet (Stand ${STAND:-?})"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
