# Einmaliger Test (v0.14.0): Gibt es zu jedem Land der Liste in config.json (paket.laender) den Auszug bei Geofabrik?
# Schreibt nichts, nur das Protokoll: Adresse, Größe der .osm.pbf, Stand, und ob die .poly-Datei da ist.
name: Geofabrik-Adressen prüfen
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Adressen prüfen
        run: |
          node -e "const c=require('./docs/config.json');console.log(c.paket.laender.map(l=>l.land+' '+l.geofabrik).join('\n'))" > liste.txt
          while read -r code pfad; do
            h=$(curl -sI "https://download.geofabrik.de/${pfad}-latest.osm.pbf")
            st=$(echo "$h" | head -1 | tr -d '\r')
            len=$(echo "$h" | grep -i '^content-length' | awk '{print $2}' | tr -d '\r')
            lm=$(echo "$h" | grep -i '^last-modified' | cut -d' ' -f2- | tr -d '\r')
            ps=$(curl -sI "https://download.geofabrik.de/${pfad}.poly" | head -1 | tr -d '\r')
            echo "$code | $pfad | $st | $(( ${len:-0} / 1048576 )) MB | $lm | poly: $ps"
          done < liste.txt
