<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0e6b7d" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
<title>Reiseführer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="lib/leaflet/leaflet.css">
<link rel="stylesheet" href="style.css?v=0.21.1">
</head>
<body>
<div id="app">
  <div id="banner" class="banner" hidden>
    <span id="bannerText">Neue Version verfügbar</span>
    <button id="bannerBtn" type="button">Neu laden</button>
  </div>

  <div id="mapWrap">
    <div id="map" aria-label="Karte"></div>
    <div class="map-top">
      <span id="ortLabel" class="chip" hidden></span>
      <span class="spacer"></span>
      <button id="btnMenu" class="round" type="button" aria-label="Menü" aria-expanded="false" aria-controls="menu">☰<span id="merkCount" class="badge" hidden>0</span></button>
    </div>
    <!-- v0.10.0: one button on the map, everything else in the menu -->
    <div id="menu" class="menu" role="menu" hidden>
      <button id="btnHere" class="mi" data-ic="🔎" type="button" role="menuitem">Hier suchen</button>
      <button id="btnSearch" class="mi" data-ic="🔍" type="button" role="menuitem">Ort suchen</button>
      <button id="btnLocate" class="mi" data-ic="◎" type="button" role="menuitem">Mein Standort</button>
      <button id="btnMerk" class="mi" data-ic="★" type="button" role="menuitem">Merkliste</button>
      <button id="btnRoute" class="mi" data-ic="⇢" type="button" role="menuitem">Strecke</button>
      <button id="btnGegend" class="mi" data-ic="📖" type="button" role="menuitem">Gegend</button>
      <button id="btnList" class="mi" data-ic="☰" type="button" role="menuitem" aria-pressed="true">Liste ausblenden</button>
      <button id="btnData" class="mi" data-ic="🗂" type="button" role="menuitem">Daten</button>
      <button id="btnSettings" class="mi" data-ic="⚙" type="button" role="menuitem">Einstellungen</button>
    </div>
    <div id="zoomHint" class="zhint" hidden></div>
  </div>

  <div id="splitter" class="splitter" role="separator" aria-label="Antippen: Liste groß oder Karte groß. Ziehen: Größe frei einstellen"><span></span></div>

  <div class="filters">
    <select id="fStars" aria-label="Mindeststerne">
      <option value="3">nur ★★★</option>
      <option value="2">ab ★★</option>
      <option value="1">ab ★</option>
      <option value="0">Alle Orte</option>
    </select>
    <select id="fKat" aria-label="Kategorie"></select>
  </div>
  <div id="prep" class="prep" hidden></div>
  <div id="cprep" class="prep" hidden></div>

  <div id="scroller" class="scroller">
    <div class="foot">
      <span>Reiseführer <b id="version">v0.21.1</b></span>
      <span>Sterne = Faustregel</span>
    </div>
    <div id="status" class="status" aria-live="polite"></div>
    <ul id="list" class="list"></ul>
  </div>
</div>

<div id="sheet" class="sheet" hidden role="dialog" aria-modal="false" aria-labelledby="sheetTitle">
  <div class="sheet-head">
    <h2 id="sheetTitle"></h2>
    <button id="sheetClose" class="round flat" type="button" aria-label="Schließen">✕</button>
  </div>
  <div id="sheetBody" class="sheet-body"></div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="lib/leaflet/leaflet.js"></script>
<script src="core.js?v=0.21.1"></script>
<script src="app.js?v=0.21.1"></script>
</body>
</html>
